# Scientific Resource Lab contracts CI.
# Runs the schema meta-validation and canonical-JSON conformance-vector checks.
# Actions are pinned to full commit SHAs for reproducibility and supply-chain
# integrity, mirroring ci.yml. Bump by resolving the new tag's commit SHA via
# the GitHub API and replacing the SHA here (keeping the comment with the
# human-readable tag).
#
# Resolved SHAs (re-resolve on update):
#   actions/checkout  v5.1.0 -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   astral-sh/setup-uv v9.0.0 -> c771a70e6277c0a99b617c7a806ffedaca235ff9
name: contracts

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  schema_meta_validate:
    name: schema-meta-validate (2020-12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Schema meta-validation (every shipped schema vs 2020-12 meta-schema)
        run: uv run python scripts/checks/schema-meta-validate.py

  schema_compat:
    name: schema-compat (loader registry complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Schema compatibility (all schemas meta-valid + loader registry complete)
        run: |
          uv run python -c "import sys; sys.path.insert(0,'src'); \
          from pathlib import Path; \
          from srl.contracts.schema import list_schemas, load_schema, meta_validate_all, schema_file_map; \
          meta_validate_all(); \
          disk = sorted(p.name for p in Path('src/srl/contracts/schemas/v1').glob('*.json')); \
          known = set(schema_file_map().values()); \
          orphans = [f for f in disk if f not in known]; \
          missing = [n for n in list_schemas() if load_schema(n).get('$id','')=='']; \
          assert not orphans, f'on-disk schemas with no loader entry: {orphans}'; \
          assert not missing, f'schemas missing $id: {missing}'; \
          assert len(list_schemas()) == len(disk), f'registry {len(list_schemas())} != disk {len(disk)}'; \
          print(f'schema-compat OK: {len(list_schemas())} schemas, registry complete')"

  canonical_json_vectors:
    name: canonical-json-vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Canonical-JSON conformance vectors (positive canonicalize, negative reject)
        run: uv run python scripts/checks/canonical-vectors.py
