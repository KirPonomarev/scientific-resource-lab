# Scientific Resource Lab execution CI.
# Runs the M1 resource-policy gate, the bounded-runner gate, and the execution
# unit tests. Actions are pinned to full commit SHAs for reproducibility and
# supply-chain integrity, mirroring ci.yml / contracts.yml. Bump by resolving
# the new tag's commit SHA via the GitHub API and replacing the SHA here
# (keeping the comment with the human-readable tag).
#
# Resolved SHAs (re-resolve on update):
#   actions/checkout  v5.1.0 -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   astral-sh/setup-uv v9.0.0 -> c771a70e6277c0a99b617c7a806ffedaca235ff9
name: execution

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  resource-policy-gate:
    name: resource-policy-gate (WP-D30)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: WP-D30 resource-policy gate
        run: uv run python scripts/checks/wp30-gate.py
      - name: Execution unit tests
        run: uv run pytest tests/execution

  bounded-runner-gate:
    name: bounded-runner-gate (WP-D31)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: WP-D31 bounded-runner gate
        # Runs on Linux, where RLIMIT_AS is enforced (the gate documents the
        # macOS AS caveat). Exits non-zero on any FAIL.
        run: uv run python scripts/checks/wp31-gate.py
  materializer-gate:
    name: materializer-gate (WP-D32)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: WP-D32 materializer/sealer gate
        # Exercises content-addressed materialization, receipt-last sealing,
        # output schema validation, store-failure handling, and path redaction.
        run: uv run python scripts/checks/wp32-gate.py
      - name: Execution unit tests (with materializer/sealer suite)
        run: uv run pytest tests/execution

  adversarial-runner-gate:
    name: adversarial-runner-gate (WP-D34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      # WP-D34 adversarial runner suite: all 14 kinds, the 50-run orphan-free
      # conformance floor, and the cwd/orphan-sweep hardening check. Runs on
      # Linux where RLIMIT_AS is enforced (the gate documents the macOS AS
      # caveat). Total runtime < 120s.
      - name: WP-D34 adversarial runner gate
        run: uv run python scripts/checks/wp34-gate.py
      - name: Security adversarial tests
        run: uv run pytest tests/security
