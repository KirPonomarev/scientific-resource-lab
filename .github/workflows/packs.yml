# Pack manifest and safe materialization gate (WP-C22).
# Actions are pinned to the same full commit SHAs as ci.yml for reproducibility
# and supply-chain integrity.
#
# Resolved SHAs (re-resolve on update):
#   actions/checkout     v5.1.0 -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   astral-sh/setup-uv   v9.0.0 -> c771a70e6277c0a99b617c7a806ffedaca235ff9
name: packs

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  pack-manifest-gate:
    name: pack-manifest-gate (WP-C22)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: WP-C22 pack-manifest gate
        run: uv run python scripts/checks/wp22-gate.py
      - name: Pytest packs
        run: uv run pytest tests/packs

  pack-admission-gate:
