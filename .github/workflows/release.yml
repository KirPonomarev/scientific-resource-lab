name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-evidence:
    name: release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: verify tag points at main history
        run: |
          git fetch --depth=50 origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: build evidence
        run: python3 scripts/release/build-evidence.py
      - name: verify evidence schema
        run: |
          python3 - <<'EOF'
          import json
          ev = json.load(open("dist/release-evidence.json"))
          assert ev["schema_version"] == "ReleaseEvidence/v1"
          assert ev["grants_authority"] is False
          assert ev["canonical_writes"] == 0
          assert ev["artifacts"], "no artifacts built"
          print("release evidence OK:", sorted(ev["artifacts"]))
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: dist/
          retention-days: 30
