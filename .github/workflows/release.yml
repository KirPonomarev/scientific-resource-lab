name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-evidence:
    name: release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Install native A08 toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pari-gp maxima gap singular cvc5 z3
      - name: Install native A09 Lean/mathlib toolchain
        run: scripts/ci/install-lean-toolchain.sh
      - name: Restore exact A09 mathlib cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .cache/srl-a09
          key: >-
            a09-${{ runner.os }}-${{ runner.arch }}-lean-4.32.2-mathlib-905b95818eb32af7874a58b427f50c1711a5e96c-${{ hashFiles('scripts/ci/install-lean-toolchain.sh', 'scripts/ci/prepare_a09_mathlib.py', 'src/srl/packs/formal/lean/adapter.py', 'configs/packs/formal/lean/corpus-pins.json') }}
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: verify tag points at main history
        run: |
          git fetch --depth=50 origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: V3.7 A01 truth-ledger gate
        run: uv run python scripts/checks/srf-v37-a01-gate.py
      - name: V3.7 A08 native algebra and SMT gate
        run: uv run python scripts/checks/srf-v37-a08-gate.py
      - name: Prepare pinned A09 mathlib project once
        env:
          SRL_A09_CACHE_ROOT: .cache/srl-a09
        run: |
          uv run python scripts/ci/prepare_a09_mathlib.py --cache-root .cache/srl-a09 --report .tmp/a09-prepare-report.json
          project_dir="$(python3 -c 'import json; print(json.load(open(".tmp/a09-prepare-report.json"))["project_dir"])')"
          echo "SRL_A09_MATHLIB_PROJECT_DIR=${project_dir}" >> "$GITHUB_ENV"
          python3 -c 'import json; r=json.load(open(".tmp/a09-prepare-report.json")); assert r["prepare_count"] <= 1; print("A09 prepare_count", r["prepare_count"], "fetch_count", r["fetch_count"], "cache_status", r["cache_status"])'
      - name: V3.7 A09 Lean/mathlib and corpus gate
        run: uv run python scripts/checks/srf-v37-a09-gate.py
      - name: build evidence
        run: python3 scripts/release/build-evidence.py
      - name: verify evidence schema
        run: |
          python3 - <<'EOF'
          import json
          ev = json.load(open("dist/release-evidence.json"))
          assert ev["schema_version"] == "ReleaseEvidence/v1"
          assert ev["grants_authority"] is False
          assert ev["canonical_writes"] == 0
          assert ev["artifacts"], "no artifacts built"
          print("release evidence OK:", sorted(ev["artifacts"]))
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: dist/
          retention-days: 30
