# Security hardening workflow (WP-A04).
# Actions are pinned to full commit SHAs for reproducibility and supply-chain
# integrity. Bump by resolving the new tag's commit SHA via the GitHub API and
# replacing the SHA here (keeping the comment with the human-readable tag).
#
# Resolved SHAs (re-resolve on update):
#   actions/checkout  v5.1.0 -> fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
#   astral-sh/setup-uv v9.0.0 -> c771a70e6277c0a99b617c7a806ffedaca235ff9
name: security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Secret scan
        run: python3 scripts/checks/secret_scan.py

  dependency-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      # pip-audit is pinned to 2.8.0. The export step materializes the locked
      # dependency set as a requirements file so pip-audit can scan it;
      # process substitution is avoided for shell portability. The local project
      # package is excluded because pip-audit cannot audit an editable source
      # tree and its wheel hash is not available in the export. The export omits
      # hashes (--no-hashes) because uv's dependency overrides (e.g. dropping
      # persim from ripser's closure) remove packages from the resolved tree
      # that pip would otherwise re-resolve transitively from ripser's wheel
      # metadata, causing a --require-hashes mismatch that is not a real
      # vulnerability. The committed uv.lock remains the source of truth.
      - name: Dependency audit
        run: |
          uv export --locked --format requirements-txt --no-emit-project --no-hashes > /tmp/requirements.txt
          uv run --with pip-audit==2.8.0 pip-audit --requirement /tmp/requirements.txt

  license-inventory:
    name: license inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: License inventory
        run: uv run python3 scripts/checks/license_inventory.py

  archive-adversarial:
    name: archive adversarial (WP-D34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Archive extraction adversarial coverage: the WP-C22 pack-extraction
      # gate (traversal/symlink/device/exec-bit rejection) plus the WP-D34
      # archive-traversal case (rejected at the runner registry before spawn).
      - name: WP-C22 pack extraction gate
        run: uv run python scripts/checks/wp22-gate.py
      - name: WP-D34 archive-traversal case (registry-rejected)
        run: uv run python scripts/checks/wp34-gate.py --check D34-01

  command-injection:
    name: command injection (WP-D34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Command-injection subset: every shell-metacharacter / path-traversal /
      # device / platform-mismatch adapter id is rejected at the static registry
      # before any process is created. Runs the D34-01 check (and the D31-01
      # registry-first injection gate for parity).
      - name: WP-D34 adversarial kinds gate
        run: uv run python scripts/checks/wp34-gate.py --check D34-01
      - name: WP-D31 command-injection gate
        run: uv run python scripts/checks/wp31-gate.py --check D31-01

  path-boundary:
    name: path boundary (WP-D34)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      # Path-boundary subset: the child's working directory is the scratch dir
      # (never the parent repo root), the cwd-isolation probe passes, and the
      # orphan sweep (setsid-evasion detector) finds no survivor. Runs the
      # D34-03 hardening check.
      - name: WP-D34 hardening gate (cwd + orphan sweep)
        run: uv run python scripts/checks/wp34-gate.py --check D34-03
