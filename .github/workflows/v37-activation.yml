      - name: Set up Julia 1.12.6
        uses: julia-actions/setup-julia@4c0cb0fce8556fdb04a90347310e5db8b1f98fb9  # v2.7.0
        with:
          version: "1.12.6"
      - name: Restore exact A12 Julia depot cache
        id: a12-julia-cache-restore
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/srl-a12-julia-depot
          key: >-
            a12-${{ runner.os }}-${{ runner.arch }}-julia-1.12.6-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            a12-${{ runner.os }}-${{ runner.arch }}-julia-1.12.6-
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install discovery dependencies (locked)
        run: uv sync --locked --extra discovery
      - name: Prepare A12 Julia depot
        timeout-minutes: 30
        env:
          JULIA_DEPOT_PATH: .cache/srl-a12-julia-depot
        run: uv run --extra discovery python scripts/checks/srf-v37-a12-prepare-julia.py
      - name: V3.7 A12 discovery and dynamics gate
        timeout-minutes: 10
        env:
          JULIA_DEPOT_PATH: .cache/srl-a12-julia-depot
        run: uv run --extra discovery python scripts/checks/srf-v37-a12-gate.py
      - name: Save exact A12 Julia depot cache
        if: always() && steps.a12-julia-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/srl-a12-julia-depot
