  a09-lean-corpora:
    name: A09 Lean/mathlib and corpus gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Install native A09 Lean/mathlib toolchain
        run: scripts/ci/install-lean-toolchain.sh
      - name: Restore exact A09 mathlib cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/srl-a09
          key: >-
            a09-${{ runner.os }}-${{ runner.arch }}-lean-4.32.2-mathlib-905b95818eb32af7874a58b427f50c1711a5e96c-${{ hashFiles('scripts/ci/install-lean-toolchain.sh', 'scripts/ci/prepare_a09_mathlib.py', 'src/srl/packs/formal/lean/adapter.py', 'configs/packs/formal/lean/corpus-pins.json') }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Prepare pinned A09 mathlib project once
        env:
          SRL_A09_CACHE_ROOT: .cache/srl-a09
        run: |
          uv run python scripts/ci/prepare_a09_mathlib.py --cache-root .cache/srl-a09 --report .tmp/a09-prepare-report.json
          project_dir="$(python3 -c 'import json; print(json.load(open(".tmp/a09-prepare-report.json"))["project_dir"])')"
          echo "SRL_A09_MATHLIB_PROJECT_DIR=${project_dir}" >> "$GITHUB_ENV"
          python3 -c 'import json; r=json.load(open(".tmp/a09-prepare-report.json")); assert r["prepare_count"] <= 1; print("A09 prepare_count", r["prepare_count"], "fetch_count", r["fetch_count"], "cache_status", r["cache_status"])'
      - name: V3.7 A09 Lean/mathlib and corpus gate
        run: uv run python scripts/checks/srf-v37-a09-gate.py

  a10-independent-provers:
    name: A10 independent prover gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: Install HOL4 host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates build-essential make polyml libpolyml-dev
      - name: Pull A10 prover images
        run: |
          docker pull rocq/rocq-prover:9.2.0
          docker pull makarius/isabelle:Isabelle2025-2
      - name: Restore exact A10 HOL4 cache
        id: a10-hol4-cache-restore
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/srl-a10
          key: >-
            a10-${{ runner.os }}-${{ runner.arch }}-hol4-trindemossen-2-${{ hashFiles('scripts/ci/prepare_a10_hol4.py', 'src/srl/packs/formal/cross_prover.py', 'configs/packs/formal/independent-prover-pins.json') }}
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Prepare pinned A10 HOL4 once
        id: a10-hol4-prepare
        env:
          SRL_A10_CACHE_ROOT: .cache/srl-a10
        run: |
          uv run python scripts/ci/prepare_a10_hol4.py --cache-root .cache/srl-a10 --report .tmp/a10-hol4-prepare-report.json
          hol4_home="$(python3 -c 'import json; print(json.load(open(".tmp/a10-hol4-prepare-report.json"))["hol4_home"])')"
          echo "SRL_A10_HOL4_HOME=${hol4_home}" >> "$GITHUB_ENV"
          python3 -c 'import json; r=json.load(open(".tmp/a10-hol4-prepare-report.json")); assert r["prepare_count"] <= 1; print("A10 HOL4 prepare_count", r["prepare_count"], "fetch_count", r["fetch_count"], "cache_status", r["cache_status"])'
      - name: V3.7 A10 independent prover gate
        env:
          SRL_A10_ROCQ_DOCKER_IMAGE: rocq/rocq-prover:9.2.0
          SRL_A10_ISABELLE_DOCKER_IMAGE: makarius/isabelle:Isabelle2025-2
        run: uv run python scripts/checks/srf-v37-a10-gate.py
      - name: Save exact A10 HOL4 cache
        if: always() && steps.a10-hol4-prepare.outcome == 'success' && steps.a10-hol4-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
        with:
          path: .cache/srl-a10
          key: >-
            a10-${{ runner.os }}-${{ runner.arch }}-hol4-trindemossen-2-${{ hashFiles('scripts/ci/prepare_a10_hol4.py', 'src/srl/packs/formal/cross_prover.py', 'configs/packs/formal/independent-prover-pins.json') }}

