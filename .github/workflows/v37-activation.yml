          key: >-
            a14-${{ runner.os }}-${{ runner.arch }}-julia-1.12.6-${{ hashFiles('pyproject.toml', 'uv.lock', 'src/srl/products/sciml_domain.py', 'scripts/checks/srf-v37-a14-prepare-julia.py', 'scripts/checks/srf-v37-a14-gate.py') }}

