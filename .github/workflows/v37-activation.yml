          SRL_A14_JULIA_PROJECT_DIR: .cache/srl-a14-julia-project
        run: uv run --extra sciml-domain python scripts/checks/srf-v37-a14-gate.py
      - name: Save exact A14 Julia SciML cache
        if: always() && steps.a14-julia-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809  # v4.2.4
