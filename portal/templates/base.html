<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  padding: 1rem;
  color: #111;
  background: #fff;
  line-height: 1.5;
}
a { color: #0645ad; }
.watermark {
  background: #fff3cd;
  border: 2px solid #ffc107;
  color: #856404;
  padding: 0.75rem;
  margin-bottom: 1rem;
  font-weight: bold;
  text-align: center;
}
main { max-width: 64rem; margin: 0 auto; }
footer {
  margin-top: 2rem;
  padding-top: 1rem;
  border-top: 1px solid #ccc;
  font-size: 0.85rem;
  color: #555;
}
table {
  border-collapse: collapse;
  width: 100%;
  margin: 1rem 0;
}
th, td {
  border: 1px solid #ccc;
  padding: 0.4rem;
  text-align: left;
  vertical-align: top;
}
th { background: #f5f5f5; }
pre {
  background: #f5f5f5;
  padding: 0.5rem;
  overflow-x: auto;
}
</style>
</head>
<body>
${watermark}
<main>
${content}
</main>
<footer>
<p>Generated by ${generator} at ${built_at}.</p>
</footer>
</body>
</html>
