# Scientific Resource Lab project metadata.
# Build backend, dependency groups, and quality tooling live here.
# See docs/adr/0001-build-backend.md for the backend selection rationale.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "srlab"
version = "1.0.1"
description = "Reproducible, bounded and evidence-first scientific computation fabric for autonomous research agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Runtime dependencies. The package was stdlib-only through Phase A; the
# contracts layer (WP-B10) adds `jsonschema` for meta-validation of shipped
# 2020-12 schema documents (docs/adr/0002-jsonschema-library.md). The units
# core pack (WP-E40) adds `pint` for dimensional analysis and unit conversion,
# isolated behind the units adapter (docs/adr/0003-pint-dependency.md). The
# SMT pack (WP-E41) adds `z3-solver` for satisfiability checking over a
# restricted S-expression formula spec, isolated behind the SMT adapter
# (docs/adr/0004-smt-solvers.md). cvc5 is NOT a dependency: its wheels bundle
# GPLv3/LGPLv3 components and ship no resolvable license expression, so it is
# excluded on license grounds and marked WAIT_LICENSE (see ADR-0004). The
# pyRiemann pack (WP-E43) adds `pyriemann`, `numpy`, and `scipy` for SPD
# geometry; all three imports are isolated behind the pyriemann adapter
# (docs/adr/0006-pyriemann.md).
# Runtime dependency notes:
# - jsonschema (WP-B10): schema meta-validation.
# - pint (WP-E40): dimensional analysis, isolated behind the units adapter.
# - z3-solver (WP-E41): SMT solving, isolated behind the SMT adapter (ADR-0004).
# - pyriemann + numpy + scipy (WP-E43): SPD geometry on the symmetric positive
#   definite manifold; all three imports are isolated behind the pyriemann adapter
#   (docs/adr/0006-pyriemann.md). numpy and scipy are declared explicitly so the
#   SRL surface can validate arrays and eigenvalues without relying only on
#   transitive dependency versions.
# - cryptography (A04): Ed25519 detached signatures for production transport
#   verification. Production private keys remain native/private config; tests
#   use ephemeral in-memory keys only.
# - sympy + mpmath (A07): P0 Python core exact symbolic algebra and
#   high-precision/interval numerics. They are admitted into the default
#   closure with permissive license metadata and real smoke/crosscheck gates.
#   python-flint is deliberately not a default dependency: current PyPI metadata
#   declares `MIT AND LGPL-3.0-or-later`, and the SRL license policy parks that
#   FLINT/Arb/Calcium lane at WAIT_LICENSE until an explicit decision exists.
# - pymc + arviz (WP-H71a): bounded one-chain Bayesian posterior fitting for the
#   ``uncertainty`` capability profile, isolated behind the pymc adapter
#   (docs/adr/0008-pymc.md). Both are Apache-2.0, BUT pytensor (pymc's backend)
#   unconditionally imports ``cons`` (LGPL-3.0-only) at import time. The SRL
#   pack policy denies the ``LGPL-`` prefix, so pymc/arviz are declared as an
#   OPTIONAL extra (``[project.optional-dependencies].bayesian``), NOT a default
#   runtime dependency. This keeps the LGPL package out of the default install
#   closure (so ``license_inventory`` passes on the default closure) while
#   leaving the adapter fully buildable and testable when the extra is opted
#   into (``uv sync --extra bayesian``). ADR-0008 records this honestly: the
#   ``pymc_arviz`` candidate's P1 verdict is WAIT_LICENSE-class because ``cons``
#   is LGPL-3.0; the adapter is proposal-only evidence until that is resolved.
#   The adapter always runs a single chain, requires an explicit seed, and
#   bounds draws/tune/wall time so the profile stays within the CI budget; a
#   fitted posterior is selection-aware evidence (not causal identification, not
#   convergence certification).
#   Bound notes: pymc 6.x and arviz 1.x require Python>=3.12, but the project
#   floor is >=3.11 (see ``requires-python``). To keep the lock satisfiable on
#   both 3.11 and 3.12 without a cross-cutting floor bump, the bounds stay inside
#   the 3.11-compatible family (pymc 5.x, arviz 0.23.x). The adapter uses only
#   the stable ``pm.sample`` / ``az.summary`` surface common to both families.
# - certifi (A11): portable CA bundle for verified HTTPS in the stdlib urllib
#   retriever. No auth material is read; this avoids platform-specific trust-store
#   drift while keeping TLS verification enabled for public source adapters.
dependencies = [
    "certifi>=2024.8.30",
    "clarabel>=0.11.1",
    "cryptography>=43",
    "cvxpy>=1.9.2",
    "jsonschema>=4.23",
    "mpmath>=1.3.0",
    "numpy>=2.0",
    "pint>=0.25.3",
    "pyriemann>=0.12",
    "ripser>=0.6.15",
    "scipy>=1.14",
    "sympy>=1.14.0",
    "z3-solver>=4.13.0",
]

authors = [{ name = "Scientific Resource Lab contributors" }]
keywords = ["scientific-computing", "reproducibility", "agents", "evidence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.scripts]
srlab = "srl.cli:main"

[project.urls]
Homepage = "https://github.com/KirPonomarev/scientific-resource-lab"
Repository = "https://github.com/KirPonomarev/scientific-resource-lab"
Changelog = "https://github.com/KirPonomarev/scientific-resource-lab/blob/main/CHANGELOG.md"

# Optional extras. The ``bayesian`` extra (WP-H71a) pulls pymc + arviz for the
# bounded one-chain posterior adapter. The ``discovery`` extra (A12) pulls the
# PySR/PySINDy/PyDMD activation engines and still requires an explicit Julia
# executable for the PySR smoke gate. These are NOT default runtime deps: their
# broader transitive closures stay opt-in so the default install closure (and
# ``license_inventory``) remains clean. Install with ``uv sync --extra bayesian``
# or ``uv sync --extra discovery`` to build/test those adapters. See ADR-0008.
[project.optional-dependencies]
bayesian = [
    "arviz>=0.20,<1",
    "pymc>=5.20,<6",
]
discovery = [
    "pydmd>=2025.8,<2026",
    "pysindy>=2.0,<3",
    "pysr>=1.5,<2",
]

# Hatchling build targets. The import package (srl) differs from the
# distribution name (srlab), so the wheel target is declared explicitly to map
# the src/ layout. The schema documents under schemas/v1 ship alongside the
# package so importlib.resources can load them at runtime. See
# docs/adr/0001-build-backend.md (build backend) and
# docs/adr/0002-jsonschema-library.md (schema loading).
[tool.hatch.build.targets.sdist]
include = [
    "src/srl",
    "src/srl/contracts/schemas/v1",
    "tests",
    "scripts",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/srl"]

# uv-native dependency groups. The dev group carries the quality toolchain.
# pytest-cov ships in dev so coverage is available on demand; it is NOT a CI
# gate yet (see Makefile `test` and ci.yml). Lower bounds pick mature releases.
[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",      # optional coverage tooling; not a gate
    "hypothesis>=6.135",
    "mypy>=1.18",
    "ruff>=0.12",
    "build>=1.3",
    # Type-checking stubs for the jsonschema runtime dependency (jsonschema
    # does not ship a py.typed marker). Dev-only; not a runtime requirement.
    "types-jsonschema>=4.23",
]

# ---------------------------------------------------------------------------
# Ruff: formatter + linter. target py312, line-length 100 (matches .editorconfig).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dist", "build", ".venv"]

[tool.ruff.lint]
# Mature, strict-ish rule set.
#   E,F    pycodestyle errors + pyflakes
#   I      isort (import sorting)
#   UP     pyupgrade (modern syntax for the 3.11+ floor)
#   B      flake8-bugbear (common pitfalls)
#   S      flake8-bandit (security; assert-free tests, no shell=True, etc.)
#   C90    mccabe complexity
#   PLC,PLE,PLR pylint subset (convention/error/refactor)
#   RUF    ruff-native rules
select = ["E", "F", "I", "UP", "B", "S", "C90", "PLC", "PLE", "PLR", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assertions, subprocess-free fakes, and "S101" assert.
"tests/**" = ["S101", "PLR2004"]
# CLI may print to stdout (that is its contract); tests inspect captured output.
# No per-file ignore needed for src/srl below; kept explicit for clarity.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Defaults: double quotes, trailing commas. Matches `ruff format` output.
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: strict for the srl package, python_version 3.12.
# ---------------------------------------------------------------------------

[[tool.mypy.overrides]]
module = "srl.*"
strict = true

# ripser.py does not ship a py.typed marker (no stub package exists). The
# adapter treats the ripser import as opaque (typed as Any, ADR-0005), so the
# missing stubs are expected and safe. This keeps mypy strict on the adapter
# body while admitting the untyped dependency.
[[tool.mypy.overrides]]
module = "ripser"
ignore_missing_imports = true

# z3 (z3-solver) ships no py.typed marker, so mypy cannot find library stubs.
# The SMT adapter (the sole z3 import site) treats all z3 objects as opaque
# Any by design (ADR-0004: z3 is isolated behind the adapter's typed surface),
# so missing stubs are expected and ignored here. See ADR-0004.
[[tool.mypy.overrides]]
module = "z3"
ignore_missing_imports = true

# cvxpy ships no stub package and has no py.typed marker. The CVXPY adapter is
# the sole import site; it treats all cvxpy objects as opaque Any by design
# (ADR-0009), so missing stubs are expected and ignored here.
[[tool.mypy.overrides]]
module = "cvxpy.*"
follow_imports = "skip"
ignore_missing_imports = true

# pymc, arviz, and pytensor (WP-H71a) live behind the optional ``bayesian``
# extra. They are isolated behind the pymc adapter (the sole import site),
# which treats all upstream objects as opaque Any by design (ADR-0008). To keep
# mypy's view identical whether or not the extra is installed: pymc/pytensor
# ship no py.typed marker, so ``ignore_missing_imports`` makes them Any when
# absent and they resolve the same way when present; arviz DOES ship a py.typed
# marker, so ``follow_imports = skip`` is needed to treat it as Any even when
# the extra is installed (otherwise ``az.rhat``/``az.ess`` are typed calls that
# flip the ``no-untyped-call`` ignore between the two install states). The
# adapter body remains strict.
[[tool.mypy.overrides]]
module = ["pymc.*", "pytensor.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arviz.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["srl"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# Pytest: testpaths tests, quiet by default. Coverage is not a gate yet.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["srl"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# uv: dependency overrides (WP-E42).
#
# ripser.py declares `persim` as a hard runtime dependency, but the core
# ``ripser.ripser()`` function — the only surface the SRL adapter uses — does
# not import it (persim is imported lazily inside the optional ``Rips.plot()``
# method, which the adapter never calls). persim pulls in `hopcroftkarp`, which
# is GPL-3.0 and therefore incompatible with the SRL Apache-2.0 policy and the
# pack license allowlist (the `GPL-` prefix is denied). Dropping persim from
# ripser's resolved closure removes the GPL transitive without affecting the
# adapter's compute path. The architecture test in
# tests/packs/test_ripser_adapter.py asserts the adapter imports neither persim
# nor hopcroftkarp.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "persim ; python_version < '0'",  # never resolve: always-false marker
]
