# Scientific Resource Lab project metadata.
# Build backend, dependency groups, and quality tooling live here.
# See docs/adr/0001-build-backend.md for the backend selection rationale.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "srlab"
version = "0.2.0"
description = "Reproducible, bounded and evidence-first scientific computation fabric for autonomous research agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# Runtime dependencies. The package was stdlib-only through Phase A; the
# contracts layer (WP-B10) adds `jsonschema` for meta-validation of shipped
# 2020-12 schema documents (docs/adr/0002-jsonschema-library.md). The units
# core pack (WP-E40) adds `pint` for dimensional analysis and unit conversion,
# isolated behind the units adapter (docs/adr/0003-pint-dependency.md). The
# SMT pack (WP-E41) adds `z3-solver` for satisfiability checking, isolated
# behind the SMT adapter; cvc5 is excluded on GPL grounds (docs/adr/0004-smt-solvers.md).
# The ripser TDA pack (WP-E42) adds `ripser` (MIT) and `numpy`, isolated behind
# the ripser adapter (docs/adr/0005-ripser.md).
dependencies = [
    "jsonschema>=4.23",
    "numpy>=2.0",
    "pint>=0.25.3",
    "ripser>=0.6.15",
    "z3-solver>=4.13.0",
]
authors = [{ name = "Scientific Resource Lab contributors" }]
keywords = ["scientific-computing", "reproducibility", "agents", "evidence"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.scripts]
srlab = "srl.cli:main"

[project.urls]
Homepage = "https://github.com/KirPonomarev/scientific-resource-lab"
Repository = "https://github.com/KirPonomarev/scientific-resource-lab"
Changelog = "https://github.com/KirPonomarev/scientific-resource-lab/blob/main/CHANGELOG.md"

# Hatchling build targets. The import package (srl) differs from the
# distribution name (srlab), so the wheel target is declared explicitly to map
# the src/ layout. The schema documents under schemas/v1 ship alongside the
# package so importlib.resources can load them at runtime. See
# docs/adr/0001-build-backend.md (build backend) and
# docs/adr/0002-jsonschema-library.md (schema loading).
[tool.hatch.build.targets.sdist]
include = [
    "src/srl",
    "src/srl/contracts/schemas/v1",
    "tests",
    "scripts",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/srl"]

# uv-native dependency groups. The dev group carries the quality toolchain.
# pytest-cov ships in dev so coverage is available on demand; it is NOT a CI
# gate yet (see Makefile `test` and ci.yml). Lower bounds pick mature releases.
[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",      # optional coverage tooling; not a gate
    "hypothesis>=6.135",
    "mypy>=1.18",
    "ruff>=0.12",
    "build>=1.3",
    # Type-checking stubs for the jsonschema runtime dependency (jsonschema
    # does not ship a py.typed marker). Dev-only; not a runtime requirement.
    "types-jsonschema>=4.23",
]

# ---------------------------------------------------------------------------
# Ruff: formatter + linter. target py312, line-length 100 (matches .editorconfig).
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["dist", "build", ".venv"]

[tool.ruff.lint]
# Mature, strict-ish rule set.
#   E,F    pycodestyle errors + pyflakes
#   I      isort (import sorting)
#   UP     pyupgrade (modern syntax for the 3.11+ floor)
#   B      flake8-bugbear (common pitfalls)
#   S      flake8-bandit (security; assert-free tests, no shell=True, etc.)
#   C90    mccabe complexity
#   PLC,PLE,PLR pylint subset (convention/error/refactor)
#   RUF    ruff-native rules
select = ["E", "F", "I", "UP", "B", "S", "C90", "PLC", "PLE", "PLR", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assertions, subprocess-free fakes, and "S101" assert.
"tests/**" = ["S101", "PLR2004"]
# CLI may print to stdout (that is its contract); tests inspect captured output.
# No per-file ignore needed for src/srl below; kept explicit for clarity.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Defaults: double quotes, trailing commas. Matches `ruff format` output.
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: strict for the srl package, python_version 3.12.
# ---------------------------------------------------------------------------

[[tool.mypy.overrides]]
module = "srl.*"
strict = true

# ripser.py does not ship a py.typed marker (no stub package exists). The
# adapter treats the ripser import as opaque (typed as Any, ADR-0005), so the
# missing stubs are expected and safe. This keeps mypy strict on the adapter
# body while admitting the untyped dependency.
[[tool.mypy.overrides]]
module = "ripser"
ignore_missing_imports = true

# z3 (z3-solver) ships no py.typed marker, so mypy cannot find library stubs.
# The SMT adapter (the sole z3 import site) treats all z3 objects as opaque
# Any by design (ADR-0004: z3 is isolated behind the adapter's typed surface),
# so missing stubs are expected and ignored here. See ADR-0004.
[[tool.mypy.overrides]]
module = "z3"
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["srl"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

# ---------------------------------------------------------------------------
# Pytest: testpaths tests, quiet by default. Coverage is not a gate yet.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["srl"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# uv: dependency overrides (WP-E42).
#
# ripser.py declares `persim` as a hard runtime dependency, but the core
# ``ripser.ripser()`` function — the only surface the SRL adapter uses — does
# not import it (persim is imported lazily inside the optional ``Rips.plot()``
# method, which the adapter never calls). persim pulls in `hopcroftkarp`, which
# is GPL-3.0 and therefore incompatible with the SRL Apache-2.0 policy and the
# pack license allowlist (the `GPL-` prefix is denied). Dropping persim from
# ripser's resolved closure removes the GPL transitive without affecting the
# adapter's compute path. The architecture test in
# tests/packs/test_ripser_adapter.py asserts the adapter imports neither persim
# nor hopcroftkarp.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = [
    "persim ; python_version < '0'",  # never resolve: always-false marker
]
